  <div class="pl">${pl.map(([u,p])=>`<div><b style="background:#${SKINS[p.s|0]?SKINS[p.s|0].c.getHexString():'888'}"></b><span style="flex:1">${esc(san(p.n))}${u===UID?' (you)':''}</span>${u===m.host?'👑':''}</div>`).join('')}</div>
  ${ctr}<button class="g" onclick="mpLeave()">Leave</button>`)}
function copyCode(){try{navigator.clipboard.writeText(MP.code)}catch(e){}}
function mpSet(k,v){if(MP&&MP.host)MP.ref.child('meta/'+k).set(v).catch(()=>{})}
function mpDiff(i){S.diff=i;save();lobbyUI()}
function mpStart(){if(!MP||!MP.host||MP.playing)return;const m=MP.meta;
 const pl=Object.entries(MP.players).sort((a,b)=>(a[1].ts||0)-(b[1].ts||0));pl.sort((a,b)=>a[0]===UID?-1:b[0]===UID?1:0);
 const used=new Set(),roster=[];
 for(const [u,p] of pl){let s=p.s|0;if(!SKINS[s]||used.has(s)){do{s=rn(0,SKINS.length-1)}while(used.has(s))}used.add(s);roster.push({n:san(p.n),s,u,b:0})}
 const nm=BOTN.slice().sort(()=>Math.random()-.5);
 for(let k=0;k<(m.bots|0);k++){let s;do{s=rn(0,SKINS.length-1)}while(used.has(s));used.add(s);roster.push({n:nm[k%nm.length],s,u:'',b:1})}
 MP.playing=true;MP.over=false;MP.inp={};MP.seq=0;MP.evs=[];MP.gs='';MP.gv=0;MP.tS=MP.tG=0;
 MP.ref.child('in').remove().catch(()=>{});
 sub(MP.ref.child('in'),'child_added',s=>{MP.inp[s.key]=+s.val()},'gsubs');
 sub(MP.ref.child('in'),'child_changed',s=>{MP.inp[s.key]=+s.val()},'gsubs');
 play(m.level|0,roster); // may drop bots if the island has no room for them
 const final=ents.map(e=>({n:e.name,s:SKINS.indexOf(e.skin),u:e.uid||'',b:e.bot?1:0}));
 MP.gs=rle();
 MP.ref.update({'meta/roster':final,'meta/res':null,'meta/status':'play','ents':snapStr(),'grid':{v:++MP.gv,d:MP.gs}}).catch(e=>mpErr('Could not start: '+(e.code||e.message)));
 DB.ref('lobbies/'+MP.code).remove().catch(()=>{})}
function startClient(m){MP.playing=true;MP.over=false;MP.lastSeq=0;MP.gotGrid=false;MP.lastA=null;MP.tI=0;
 const roster=Array.isArray(m.roster)?m.roster:Object.values(m.roster||{});if(!roster.length)return;
 play(m.level|0,roster);
 sub(MP.ref.child('ents'),'value',s=>{const v=s.val();if(typeof v==='string')applySnap(v)},'gsubs');
 sub(MP.ref.child('grid'),'value',s=>{const v=s.val();if(v&&typeof v.d==='string')applyGrid(v.d)},'gsubs')}
// ---- snapshot encode / decode
function rle(){const s=[];let pv=owner[0],n=0;for(let c=0;c<L;c++){if(owner[c]===pv)n++;else{s.push(pv+':'+n);pv=owner[c];n=1}}s.push(pv+':'+n);return s.join(',')}
function unrle(str){const a=new Uint8Array(L);let c=0;for(const t of str.split(',')){const i=t.indexOf(':');let v=+t.slice(0,i);const n=+t.slice(i+1);if(!(v>=0&&v<=ents.length))v=0;a.fill(v,c,c+n);c+=n;if(c>=L)break}return a}
function snapStr(){return JSON.stringify({t:+tmr.toFixed(1),bs:+botSpd.toFixed(2),
 e:ents.map(e=>[e.alive?1:0,+e.x.toFixed(2),+e.y.toFixed(2),+e.a.toFixed(2),Math.ceil(e.shield),Math.ceil(e.speedT),e.kills,e.tc.length?1:0].join(',')).join(';'),
 p:pus.map(p=>[p.ty,p.cx,p.cy]),f:MP.evs})}
function applyGrid(d){if(!MP||!player)return;const before=count(player.id);owner=unrle(d);
 if(MP.gotGrid){const g=(count(player.id)-before)/landN*100;if(g>.05){floatText('+'+g.toFixed(1)+'%',player.x,player.y,'#fff');sfx.claim(g)}}
 MP.gotGrid=true;dirtyTex=true}
function applySnap(s){if(!MP||MP.host)return;let d;try{d=JSON.parse(s)}catch(x){return}
 if(typeof d.t==='number')tmr=d.t;if(typeof d.bs==='number')botSpd=d.bs;
 String(d.e||'').split(';').forEach((row,k)=>{const e=ents[k];if(!e)return;const [al,x,y,a,sh,sp,kl,tr]=row.split(',').map(Number);
  if(!al){if(e.alive){e.alive=false;scene.remove(e.mesh);burst(e.x,e.y,e.col,e===player?36:22);e.tp=[];e.tr=0;if(e===player){sfx.die();shake=1;big('💥 Respawning…',2500)}}return}
  if(!e.alive){e.alive=true;scene.add(e.mesh);e.x=x;e.y=y;e.a=a;e.tp=[];e.lean=0;if(e===player)$('big').style.display='none'}
  if(e===player&&(sh>e.shield+.5||sp>e.speedT+.5))sfx.pick();
  e.tx=x;e.ty=y;if(e!==player||ptarget()==null)e.ta=a;e.shield=sh;e.speedT=sp;e.kills=kl;e.tr=tr});
 const want=Array.isArray(d.p)?d.p:[];
 for(let i=pus.length-1;i>=0;i--){const q=pus[i];if(!want.some(w=>w[1]===q.cx&&w[2]===q.cy)){burst(q.x,q.y,PU[q.ty].col,10,.8);scene.remove(q.g);pus.splice(i,1)}}
 for(const w of want)if(PU[w[0]]&&!pus.some(q=>q.cx===w[1]&&q.cy===w[2]))makePU(w[0],w[1],w[2]);
 if(Array.isArray(d.f))for(const f of d.f)if(f[0]>MP.lastSeq){MP.lastSeq=f[0];showEv(f[1],f[2],f[3])}}
// ---- match end
function mpFinish(w,cnt){MP.over=true;state='over';
 const st=ents.map((e,i)=>({n:e.name,s:SKINS.indexOf(e.skin),p:+(cnt[i+1]/landN*100).toFixed(1),k:e.kills})).sort((a,b)=>b.p-a.p);
 const res={w:ents[w].name,wi:w,t:+tmr.toFixed(1),st};
 MP.ref.update({'meta/status':'over','meta/res':res}).catch(()=>{});showResults(res)}
function showResults(res){MP.over=true;state='over';$('hud').style.display='none';joy=null;$('joy').style.display='none';$('big').style.display='none';
 const won=ents[res.wi]===player;if(won)sfx.win();
 const rows=(res.st||[]).map((r,i)=>`<div><b style="background:#${SKINS[r.s|0]?SKINS[r.s|0].c.getHexString():'888'}"></b><span style="flex:1">${i+1}. ${esc(san(r.n))}</span><span>${(+r.p).toFixed(1)}% · ⚔ ${r.k|0}</span></div>`).join('');
 ui(`<h2>${won?'🏆 You win!':'🏁 '+esc(san(res.w))+' wins!'}</h2><small>${esc(COUNTRIES[cur][0])} · ${fmt(+res.t||0)}</small><div class="pl">${rows}</div>${MP.host?'<button onclick="mpAgain()">↻ Play again</button>':'<small>Waiting for the host…</small><br>'}<button class="g" onclick="mpLeave()">Leave</button>`)}
function mpAgain(){if(!MP||!MP.host)return;MP.inp={};MP.ref.update({'meta/status':'lobby','meta/res':null,'meta/roster':null,ents:null,grid:null,in:null}).catch(()=>{})}
function mpGone(msg){const m=MP;if(!m)return;MP=null;m.subs.concat(m.gsubs).forEach(f=>f());state='menu';$('hud').style.display='none';$('big').style.display='none';ui(`<h2>Room closed</h2><p>${esc(msg)}</p><button onclick="menu()">Menu</button>`)}
async function mpLeave(){const m=MP;if(!m)return;MP=null;m.subs.concat(m.gsubs).forEach(f=>f());state='menu';$('hud').style.display='none';
 try{if(m.host){m.ref.onDisconnect().cancel();DB.ref('lobbies/'+m.code).onDisconnect().cancel();DB.ref('lobbies/'+m.code).remove().catch(()=>{});await m.ref.remove()}
  else{const p=m.ref.child('players/'+UID);p.onDisconnect().cancel();m.ref.child('in/'+UID).remove().catch(()=>{});await p.remove()}}catch(e){}
 menu()}

// ---- input events
addEventListener('keydown',e=>{if(e.target&&/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName))return;audio();const k=e.key.length==1?e.key.toLowerCase():e.key;keys[k]=true;if(k.startsWith('Arrow')||k===' ')e.preventDefault();
 if(k==='p'||k==='Escape'){state==='play'?pause():state==='pause'&&resume()}if(k==='m')sound()});
addEventListener('keyup',e=>{keys[e.key.length==1?e.key.toLowerCase():e.key]=false});addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!MP)pause()});
addEventListener('mousemove',e=>{if(performance.now()-lastTouch<800)return;mx=e.clientX;my=e.clientY;touch=false});
addEventListener('pointerdown',audio);
const joyEl=$('joy'),knob=joyEl.firstElementChild;
function joyDraw(dx,dy){joyEl.style.left=joy.ox+'px';joyEl.style.top=joy.oy+'px';knob.style.transform=`translate(${dx}px,${dy}px)`}
addEventListener('touchstart',e=>{touch=true;lastTouch=performance.now();audio();if(e.target.closest&&(e.target.closest('button')||e.target.closest('#ui')))return;if((state!=='play'&&state!=='count')||joy)return;
 const t=e.changedTouches[0];joy={id:t.identifier,ox:t.clientX,oy:t.clientY,ang:null};joyEl.style.display='block';joyDraw(0,0)},{passive:true});
addEventListener('touchmove',e=>{lastTouch=performance.now();if(!joy)return;for(const t of e.changedTouches)if(t.identifier===joy.id){let dx=t.clientX-joy.ox,dy=t.clientY-joy.oy;const d=Math.hypot(dx,dy);
 if(d>10)joy.ang=Math.atan2(dy,dx);if(d>60){joy.ox+=dx/d*(d-60);joy.oy+=dy/d*(d-60);dx=t.clientX-joy.ox;dy=t.clientY-joy.oy}
 const dd=Math.hypot(dx,dy)||1,k=Math.min(1,44/dd);joyDraw(dx*k,dy*k)}},{passive:true});
const tend=e=>{lastTouch=performance.now();if(!joy)return;for(const t of e.changedTouches)if(t.identifier===joy.id){joy=null;joyEl.style.display='none'}};
addEventListener('touchend',tend);addEventListener('touchcancel',tend);
// ---- main loop
let last=0;
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000||0);last=t;
 const sim=!MP||MP.host; // false only for a joined (non-host) multiplayer client
 if(state==='count'){cd-=dt;const n=Math.ceil(cd);if(n>0&&n<last3){last3=n;big(String(n),900);sfx.tick()}if(cd<=0){state='play';big('GO!',700);sfx.go()}}
 if(state==='play'){
  if(sim){tmr+=dt;
   for(const e of ents){if(e.alive){e.speedT=Math.max(0,e.speedT-dt);e.shield=Math.max(0,e.shield-dt);step(e,dt);
     if(e.alive&&e.speedT>0&&Math.random()<.5)burst(e.x-Math.cos(e.a)*.4,e.y-Math.sin(e.a)*.4,e.col,1,.25,.45)}
    else if((e.bot||MP)&&e.respawn>0){e.respawn-=dt;if(e.respawn<=0){const s=spot(true)||spot(false);if(s){place(e,s[0],s[1]);e.shield=3;e.agg=Math.random()<aggP;scene.add(e.mesh);dirtyTex=true;if(e===player)$('big').style.display='none'}else e.respawn=1}}}
   puT-=dt;if(puT<=0){puT=3.5;spawnPU()}}
  hudT+=dt;if(hudT>.25){hudT=0;hud()}}
 if(MP&&MP.playing){
  if(MP.host){ // publish snapshots
   if(state==='play'||state==='count'){
    MP.tS+=dt;if(MP.tS>=.1){MP.tS=0;MP.ref.child('ents').set(snapStr()).catch(()=>{})}
    MP.tG+=dt;if(MP.tG>=.25){MP.tG=0;const g=rle();if(g!==MP.gs){MP.gs=g;MP.ref.child('grid').set({v:++MP.gv,d:g}).catch(()=>{})}}}
  }else if(state==='play'||state==='count'){ // joiner: smooth + extrapolate remote entities, send my steering
   const k=Math.min(1,dt*12);
   for(const e of ents){if(!e.alive)continue;const sp=state==='play'?(e.bot?botSpd:5.2)*(e.speedT>0?1.45:1):0;
    e.tx+=Math.cos(e.ta)*sp*dt;e.ty+=Math.sin(e.ta)*sp*dt;
    let d=e.ta-e.a;d=Math.atan2(Math.sin(d),Math.cos(d));e.a+=d*Math.min(1,dt*18);e.lean+=(cl(d,-1,1)*.35-e.lean)*.15;
    e.x+=(e.tx-e.x)*k;e.y+=(e.ty-e.y)*k;
    if(e.tr){const lp=e.tp[e.tp.length-1];if(!lp||Math.hypot(e.x-lp.x,e.y-lp.y)>.26)e.tp.push({x:e.x,y:e.y})}else if(e.tp.length)e.tp=[]}
   if(state==='play'&&player.alive){MP.tI+=dt;if(MP.tI>.066){MP.tI=0;const a=ptarget();if(a!=null){const q=Math.round(a*20)/20;if(q!==MP.lastA){MP.lastA=q;MP.ref.child('in/'+UID).set(q).catch(()=>{})}}}}}}
 for(let i=pus.length-1;i>=0;i--){const p=pus[i];p.t+=dt;if(state==='play'&&sim)p.life-=dt;const s=p.life<1.5?Math.max(0,p.life/1.5):Math.min(1,p.t*4);p.g.scale.setScalar(Math.max(.01,s));p.gem.rotation.y+=dt*2.2;p.gem.position.y=.9+Math.sin(p.t*3)*.12;if(p.life<=0){scene.remove(p.g);pus.splice(i,1)}}
 texT+=dt;if(dirtyTex&&texT>.07){texT=0;dirtyTex=false;redraw()}
 let n=0;dummy.rotation.set(0,0,0);for(const e of ents){if(!e.alive)continue;e.mesh.rotation.y=Math.atan2(Math.cos(e.a),Math.sin(e.a));e.mesh.rotation.z=e.lean||0;e.mesh.position.set(e.x-W/2,.45+Math.abs(Math.sin(t/110+e.id))*.05,e.y-W/2);
  e.sh.visible=e.shield>0&&(e.shield>1.5||Math.floor(t/110)%2===0);
  for(const p of e.tp){if(n>=6000)break;const ps=1+.18*Math.sin(t/160+n*.45);dummy.scale.set(ps,ps*.8,ps);dummy.position.set(p.x-W/2,.16,p.y-W/2);dummy.updateMatrix();trailI.setMatrixAt(n,dummy.matrix);trailI.setColorAt(n++,e.trailC)}}
 trailI.count=n;trailI.instanceMatrix.needsUpdate=true;if(trailI.instanceColor)trailI.instanceColor.needsUpdate=true;
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;p.vy-=14*dt;p.m.position.x+=p.vx*dt;p.m.position.z+=p.vz*dt;p.m.position.y+=p.vy*dt;p.m.rotation.x+=dt*6;p.m.scale.multiplyScalar(.985);if(p.life<=0){scene.remove(p.m);parts.splice(i,1)}}
 wt.offset.x+=dt*.004;wt.offset.y+=dt*.003;wt2.offset.x-=dt*.003;wt2.offset.y+=dt*.002;foM.material.opacity=.5+.3*Math.sin(t/450);shM.material.opacity=.7+.1*Math.sin(t/900);sparks[0].material.opacity=.35+.35*Math.sin(t/700);sparks[1].material.opacity=.35+.35*Math.sin(t/700+3.1);decorUpdate(dt);
 let lx=0,lz=0;
 if(state==='menu'){camera.position.set(Math.sin(t/4000)*38,30,Math.cos(t/4000)*38);camera.lookAt(0,0,0)}
 else{const k=1-Math.exp(-dt*5),tx=player.x-W/2+Math.cos(player.a)*1.8,tz=player.y-W/2+Math.sin(player.a)*1.8,th=16+myPct*12;
  camB.x+=(tx-camB.x)*k;camB.y+=(th-camB.y)*k;camB.z+=((tz+camB.y*.735)-camB.z)*k;
  shake=Math.max(0,shake-dt*2.2);camera.position.set(camB.x+(Math.random()-.5)*shake*.8,camB.y+(Math.random()-.5)*shake*.8,camB.z);
  lx=camB.x;lz=camB.z-camB.y*.735;camera.lookAt(lx,0,lz)}
 dl.position.set(lx+10,28,lz+6);dl.target.position.set(lx,0,lz);
 renderer.render(scene,camera)}
mkDecor();syncBtn();menu();requestAnimationFrame(loop);
</script></body></html>
