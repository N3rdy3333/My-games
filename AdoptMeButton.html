
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: transparent;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    button {
      position: relative;
      isolation: isolate;
      overflow: hidden;

      width: 157px;
      height: 40px;
      padding: 0 20px;

      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 12px;

      background: linear-gradient(
        135deg,
        #ffffff 0%,
        #f3f5ff 50%,
        #e8edff 100%
      );

      color: #171a2b;
      font-family: "Comic Sans MS", cursive;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.3px;

      cursor: pointer;

      box-shadow:
        0 3px 8px rgba(0, 0, 0, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);

      transition:
        transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1),
        box-shadow 220ms ease,
        border-color 220ms ease,
        background 220ms ease;
    }

    /* Animated glossy shine */
    button::before {
      content: "";
      position: absolute;
      z-index: -1;
      top: -50%;
      left: -100%;
      width: 45%;
      height: 200%;

      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.95),
        transparent
      );

      transform: skewX(-22deg);
      transition: left 550ms ease;
      pointer-events: none;
    }

    /* Subtle purple-blue color glow */
    button::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      border-radius: inherit;

      background: linear-gradient(
        135deg,
        rgba(124, 92, 255, 0.13),
        transparent 55%,
        rgba(66, 153, 255, 0.13)
      );

      opacity: 0;
      transition: opacity 220ms ease;
      pointer-events: none;
    }

    /* Hover lift and glow */
    button:hover {
      transform: translateY(-3px) scale(1.025);
      border-color: rgba(133, 117, 255, 0.7);

      box-shadow:
        0 8px 20px rgba(92, 76, 220, 0.2),
        0 0 14px rgba(133, 117, 255, 0.16),
        inset 0 1px 0 #ffffff;
    }

    button:hover::before {
      left: 150%;
    }

    button:hover::after {
      opacity: 1;
    }

    /* Smooth press animation */
    button:active {
      transform: translateY(0) scale(0.96);

      box-shadow:
        0 2px 5px rgba(92, 76, 220, 0.16),
        inset 0 2px 5px rgba(0, 0, 0, 0.08);

      transition-duration: 80ms;
    }

    button:focus-visible {
      outline: 2px solid #8575ff;
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      button,
      button::before,
      button::after {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <button onclick="AM()">Adopt Me</button>

  <script>
    function AM() {
      const newWindow = window.open("about:blank", "_blank");

      fetch(
        "https://cdn.jsdelivr.net/gh/N3rdy3333/My-games/Adopt%20Me%20-%20Halloween%20V85.html",
      )
        .then((response) => response.text())
        .then((AM) => {
          newWindow.document.open();
          newWindow.document.write(AM);
          newWindow.document.close();
        });
    }
  </script>

</body>
</html>
