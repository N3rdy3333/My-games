<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BoatCraft 3D — Build, Buy, Set Sail!</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<style>
:root{--p:#1d2a36;--p2:#28394a;--cr:#f2f7fb;--co:#ff7a55;--ln:#3d5368}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#8fd3ee;font-family:'Quicksand',sans-serif;color:var(--cr)}
canvas{display:block;touch-action:none}
.bar{backdrop-filter:blur(8px);position:fixed;left:0;right:0;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:rgba(29,42,54,.9)}
#top{top:0;padding-top:calc(10px + env(safe-area-inset-top,0px))}
h1{font-family:'Baloo 2',sans-serif;font-size:19px;margin:0 6px 0 0;white-space:nowrap}
.btn{background:var(--p2);color:var(--cr);border:1px solid var(--ln);border-radius:10px;padding:8px 11px;font:700 12.5px 'Quicksand',sans-serif;cursor:pointer;white-space:nowrap}
.btn:hover{background:#365068}.btn.go{background:linear-gradient(180deg,#ff946f,#ff6a42);color:#2b1209;border-color:#e8623d;font-size:14px}
.sp{flex:1}.money{font-weight:700;color:#ffd96b;font-size:15px}
#bottom{bottom:0;flex-direction:column;align-items:stretch;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
#palette{display:flex;gap:8px;overflow-x:auto}
.item{flex:0 0 auto;width:68px;text-align:center;padding:6px 4px;border-radius:10px;border:2px solid transparent;cursor:pointer}
.item:hover{background:var(--p2)}.item.sel{background:var(--co);color:#2b1209}
.ic{font-size:22px}.lbl{font-size:10.5px;font-weight:700}
#stats{display:flex;gap:14px;font-size:12.5px;font-weight:700;flex-wrap:wrap}
#vig{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at center,transparent 55%,rgba(5,20,40,.5))}
#flash{position:fixed;inset:0;pointer-events:none;z-index:3;background:#dfe9ff;opacity:0}
#spdo{position:absolute;bottom:calc(34px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);font:700 18px 'Baloo 2',sans-serif;background:#1d2a36bb;padding:6px 16px;border-radius:12px;white-space:nowrap}
#hint{position:fixed;top:calc(62px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:4;background:rgba(29,42,54,.85);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;text-align:center;max-width:92vw;pointer-events:none}
#toast{position:fixed;top:calc(100px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:30;background:#000c;padding:8px 16px;border-radius:12px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
#hud{display:none;position:fixed;inset:0;z-index:5;pointer-events:none}
#hud .t{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(90vw,420px);background:rgba(29,42,54,.85);padding:10px 14px;border-radius:14px;font-weight:700}
.meter{height:12px;background:#0006;border-radius:7px;overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;width:100%}
#hpb{background:#58d46a}#prb{background:#ffd96b;width:0}
.steer{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:84px;height:84px;border-radius:50%;background:#1d2a36bb;border:2px solid var(--ln);font-size:34px;color:var(--cr);pointer-events:auto;touch-action:none}
#sl{left:20px}#sr{right:20px}
.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#0a1018aa;padding:16px}
.modal.show{display:flex}
.box{width:min(94vw,520px);max-height:86vh;overflow:auto;background:var(--p);border:1px solid var(--ln);border-radius:16px;padding:16px}
.box h3{font-family:'Baloo 2',sans-serif;margin:0 0 8px;font-size:20px}
.box p{font-size:13px;line-height:1.4;margin:0 0 10px}
.row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;background:var(--p2);margin-bottom:6px}
.row b{flex:1}.row small{display:block;font-weight:600;opacity:.75}
textarea{width:100%;height:110px;border-radius:10px;border:1px solid var(--ln);background:#121b24;color:var(--cr);font:11.5px monospace;padding:8px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
</style></head><body>
<div id="vig"></div><div id="flash"></div>
<div id="hint">Click to place blocks · drag to orbit · scroll to zoom</div>
<div id="toast"></div>

<div class="bar" id="top">
  <h1>⛵ BoatCraft 3D</h1>
  <button class="btn go" id="sail">⛵ Set Sail!</button>
  
  <div class="sp"></div>
  <span class="money" id="money">$100</span>
  <button class="btn" id="shopBtn">🛒 Shop</button>
  <button class="btn" id="qBtn">✨ Quality</button>
  <button class="btn" id="saveBtn">💾 Save</button>
  <button class="btn" id="loadBtn">📂 Load</button>
  <button class="btn" id="clearBtn">✨ Clear Boat</button>
</div>
<div class="bar" id="bottom">
  <div id="stats"></div>
  <div id="palette"></div>
</div>

<div id="hud">
  <div class="t"><div style="display:flex;justify-content:space-between"><span id="hLv">Level 1</span><span id="hHp">HP</span></div>
    <div class="meter"><i id="hpb"></i></div><div class="meter"><i id="prb"></i></div></div>
  <div id="spdo"></div><button class="steer" id="sl">◀</button><button class="steer" id="sr">▶</button>
</div>

<div class="modal" id="shop"><div class="box"><h3>🛒 Shipyard Shop</h3><p id="shopMoney"></p><div id="shopList"></div><div class="acts"><button class="btn" id="shopClose">Close</button></div></div></div>
<div class="modal" id="codeM"><div class="box"><h3 id="cTitle"></h3><p id="cDesc"></p><textarea id="cText" spellcheck="false"></textarea>
  <div class="acts"><button class="btn" id="cClose">Close</button><button class="btn go" id="cGo"></button></div></div></div>
<div class="modal" id="res"><div class="box"><h3 id="rT"></h3><p id="rP"></p><div class="acts"><button class="btn go" id="rBtn">Back to Dock</button></div></div></div>

<script>
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const MATS={
  wood:{n:'Wood',c:0x9a6b4a,hp:10,w:1,price:0},
  reinf:{n:'Reinforced',c:0x6b4429,hp:18,w:1.3,price:50},
  iron:{n:'Iron',c:0x8a8f96,hp:30,w:2.2,price:120},
  steel:{n:'Steel',c:0xb9c4d0,hp:48,w:2.6,price:250},
  titan:{n:'Titanium',c:0x7f93b8,hp:75,w:2,price:500}};
const PARTS={sail:{n:'Sail',hp:2,w:.3,price:0},engine:{n:'Engine',hp:12,w:1.5,price:150}};
const INFO=t=>MATS[t]||PARTS[t];
const REWARDS=[20,30,40,55,70,90,110,130,160,200];
const KEY='boatcraft3d_v1', MAXB=100;
let S={money:100,owned:{wood:1,sail:1},best:0,blocks:[]};
function sanitize(d){
  if(!d||typeof d.money!=='number'||!d.owned||!Array.isArray(d.blocks))throw 0;
  const o={wood:1,sail:1};Object.keys(d.owned).forEach(k=>{if(INFO(k)&&d.owned[k])o[k]=1});
  const bl=d.blocks.filter(b=>Array.isArray(b)&&INFO(b[3])&&b.slice(0,3).every(Number.isFinite)).slice(0,MAXB);
  return{money:Math.max(0,Math.floor(d.money)),owned:o,best:clamp(d.best|0,0,10),blocks:bl};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
try{const r=localStorage.getItem(KEY);if(r)S=sanitize(JSON.parse(r))}catch(e){}

// ---- scene ----
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8fd3ee);scene.fog=new THREE.Fog(0x8fd3ee,70,210);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,400);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const hemi=new THREE.HemisphereLight(0xffffff,0x4a7a9a,.95);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff2d6,.8);sun.position.set(15,25,10);scene.add(sun,sun.target);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-32,right:32,top:32,bottom:-32,near:1,far:90});sun.shadow.bias=-.0015;
// sky dome + shader ocean
const SKYU={uTop:{value:new THREE.Color(0x4a86c0)},uHor:{value:new THREE.Color(0x8fd3ee)},uSunDir:{value:new THREE.Vector3(.35,.26,-1).normalize()},uSunI:{value:.2}};
const domeMat=new THREE.ShaderMaterial({uniforms:SKYU,side:THREE.BackSide,depthWrite:false,fog:false,
vertexShader:'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
fragmentShader:`varying vec3 vP;uniform vec3 uTop,uHor,uSunDir;uniform float uSunI;
void main(){vec3 d=normalize(vP);float y=max(d.y,0.);vec3 c=mix(uHor,uTop,pow(y,.45));float s=max(dot(d,normalize(uSunDir)),0.);
c+=vec3(1.,.8,.5)*(pow(s,800.)*4.+pow(s,24.)*.45+pow(s,4.)*.12)*uSunI;gl_FragColor=vec4(c,1.);}`});
const dome=new THREE.Mesh(new THREE.SphereGeometry(300,32,16),domeMat);dome.renderOrder=-10;dome.frustumCulled=false;scene.add(dome);
const envS=new THREE.Scene();envS.add(new THREE.Mesh(new THREE.SphereGeometry(50,24,12),domeMat));
const ENV=new THREE.PMREMGenerator(renderer).fromScene(envS,.04).texture;
const OU={uTime:{value:0},uDeep:{value:new THREE.Color(.03,.2,.34)},uShal:{value:new THREE.Color(.1,.55,.68)},uFog:{value:new THREE.Color(0x8fd3ee)},uHor:SKYU.uHor,uTop:SKYU.uTop,uSunDir:SKYU.uSunDir,uSunI:SKYU.uSunI,uFN:{value:70},uFF:{value:230}};
const WH='float H(vec2 p,float t){return sin(p.x*.35+t*1.3)*.12+sin(p.y*.28+t*1.7)*.1+sin((p.x+p.y)*.2+t)*.08+sin(p.x*.9-p.y*.7+t*2.1)*.04;}';
const og=new THREE.PlaneGeometry(500,500,160,160);og.rotateX(-Math.PI/2);
const ocean=new THREE.Mesh(og,new THREE.ShaderMaterial({uniforms:OU,
vertexShader:'uniform float uTime;varying vec3 vW;varying float vH;'+WH+'void main(){vec4 w=modelMatrix*vec4(position,1.);float h=H(w.xz,uTime);w.y+=h;vW=w.xyz;vH=h;gl_Position=projectionMatrix*viewMatrix*w;}',
fragmentShader:`uniform vec3 uDeep,uShal,uFog,uHor,uTop,uSunDir;uniform float uTime,uSunI,uFN,uFF;varying vec3 vW;varying float vH;`+WH+`
float H2(vec2 p){return H(p,uTime)+sin(p.x*2.3+uTime*3.)*sin(p.y*1.9-uTime*2.)*.02;}
float hs(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float nz(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hs(i),hs(i+vec2(1,0)),f.x),mix(hs(i+vec2(0,1)),hs(i+vec2(1,1)),f.x),f.y);}
void main(){vec2 p=vW.xz;float e=.15;
float hx=H2(p+vec2(e,0.))-H2(p-vec2(e,0.)),hz=H2(p+vec2(0.,e))-H2(p-vec2(0.,e));
vec3 N=normalize(vec3(-hx/(2.*e)*1.7,1.,-hz/(2.*e)*1.7));vec3 V=normalize(cameraPosition-vW);
float fr=pow(1.-max(dot(N,V),0.),4.);vec3 R=reflect(-V,N);vec3 sky=mix(uHor,uTop,pow(max(R.y,0.),.45));
vec3 c=mix(mix(uDeep,uShal,clamp(.5+vH*3.,0.,1.)),sky,.12+fr*.85);
vec3 L=normalize(uSunDir);float d0=max(dot(R,L),0.);c+=vec3(1.,.9,.7)*(pow(d0,200.)*3.+pow(d0,18.)*.18)*uSunI;
float foam=smoothstep(.15,.26,vH+nz(p*1.5+uTime*.3)*.07)*.6+smoothstep(.75,.92,nz(p*.8-uTime*.2))*.1;
c=mix(c,vec3(1.),clamp(foam,0.,1.)*.8);
c=mix(c,uFog,smoothstep(uFN,uFF,length(cameraPosition-vW)));gl_FragColor=vec4(c,1.);}`}));
ocean.position.y=.35;ocean.frustumCulled=false;scene.add(ocean);
let wt=0;function waveH(x,z){return Math.sin(x*.35+wt*1.3)*.12+Math.sin(z*.28+wt*1.7)*.1+Math.sin((x+z)*.2+wt)*.08+Math.sin(x*.9-z*.7+wt*2.1)*.04}
const dock=new THREE.Group();scene.add(dock);
const grid=new THREE.GridHelper(18,18,0xffffff,0xbfe6f5);grid.position.y=.37;dock.add(grid);
const arrow=new THREE.Mesh(new THREE.ConeGeometry(.5,1.4,12),new THREE.MeshLambertMaterial({color:0xff7a55}));
arrow.rotation.x=-Math.PI/2;arrow.position.set(0,.6,-8.7);dock.add(arrow);

// ---- blocks ----
const G1=new THREE.BoxGeometry(.98,.98,.98),GS=new THREE.BoxGeometry(1,1,.12),mc={};
function mat(t){if(mc[t])return mc[t];let m;
  if(t==='sail')m=new THREE.MeshLambertMaterial({color:0xf4f1e6});
  else if(t==='engine')m=new THREE.MeshLambertMaterial({color:0x3a3d44});
  else if(t==='wood'||t==='reinf')m=new THREE.MeshLambertMaterial({color:MATS[t].c});
  else m=new THREE.MeshStandardMaterial({color:MATS[t].c,metalness:.85,roughness:.32,envMap:ENV});
  return mc[t]=m}
function mk(b,ox=0,oz=0){
  const t=b[3],m=new THREE.Mesh(t==='sail'?GS:G1,mat(t));
  m.position.set(b[0]-ox,b[1]+.5,b[2]-oz);m.userData={cell:[b[0],b[1],b[2]],t};m.castShadow=m.receiveShadow=true;if(t!=='sail')m.add(new THREE.LineSegments(EG,EM));
  if(t==='engine'){const f=new THREE.Mesh(new THREE.BoxGeometry(.5,.5,.1),new THREE.MeshBasicMaterial({color:new THREE.Color(3,1.5,.4)}));f.position.z=.5;m.add(f)}
  return m}
const EG=new THREE.EdgesGeometry(G1),EM=new THREE.LineBasicMaterial({color:0x000000,transparent:true,opacity:.3});
const bm=new THREE.Group();scene.add(bm);
function rebuild(){while(bm.children.length)bm.remove(bm.children[0]);S.blocks.forEach(b=>bm.add(mk(b)))}
function stats(){let hp=0,w=0,sa=0,en=0,hull=0;
  S.blocks.forEach(b=>{const m=INFO(b[3]);hp+=m.hp;w+=m.w;if(b[3]==='sail')sa++;if(b[3]==='engine')en++;if(MATS[b[3]])hull++});
  return{hp,w,hull,speed:clamp(4+sa*1.3+en*2.8-w*.08,2.5,30)}}
function ui(){
  const s=stats();$('money').textContent='$'+S.money;
  $('stats').innerHTML=`<span>❤️ HP ${s.hp}</span><span>🚀 Speed ${s.speed.toFixed(1)}</span><span>⚖️ Weight ${s.w.toFixed(0)}</span><span>🧱 ${S.blocks.length}/${MAXB}</span>`;
  pal()}
let tool='wood',sel=1,mode='build';
function pal(){const p=$('palette');p.innerHTML='';
  const it=[...Object.keys(MATS).map(k=>({id:k,n:MATS[k].n,i:'■',c:'#'+MATS[k].c.toString(16).padStart(6,'0'),own:S.owned[k]})),
    {id:'sail',n:'Sail',i:'⛵',own:1},{id:'engine',n:'Engine',i:'⚙️',own:S.owned.engine},{id:'erase',n:'Erase',i:'🗑',own:1}];
  it.forEach(x=>{const d=document.createElement('div');d.className='item'+(tool===x.id?' sel':'');
    d.innerHTML=`<div class="ic" style="${x.c&&x.own?'color:'+x.c:''}">${x.own?x.i:'🔒'}</div><div class="lbl">${x.n}</div>`;
    d.onclick=()=>{if(!x.own){openShop();return}tool=x.id;pal()};p.appendChild(d)})}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1800)}

// ---- build input ----
let theta=.5,phi=.95,radius=17;const tgt=new THREE.Vector3(0,1,0);
function bcam(){camera.position.set(tgt.x+radius*Math.sin(phi)*Math.sin(theta),tgt.y+radius*Math.cos(phi),tgt.z+radius*Math.sin(phi)*Math.cos(theta));camera.lookAt(tgt)}
addEventListener('wheel',e=>{if(mode==='build')radius=clamp(radius+e.deltaY*.02,6,40)},{passive:true});
const rc=new THREE.Raycaster(),mouse=new THREE.Vector2(),gp=new THREE.Plane(new THREE.Vector3(0,1,0),0);
const ghost=new THREE.Mesh(G1,new THREE.MeshBasicMaterial({color:0x66ff88,transparent:true,opacity:.4}));ghost.visible=false;scene.add(ghost);
const valid=c=>Math.abs(c[0])<=4&&Math.abs(c[2])<=7&&c[1]>=0&&c[1]<=5&&!S.blocks.some(b=>b[0]==c[0]&&b[1]==c[1]&&b[2]==c[2]);
function cellAt(x,y){
  mouse.set(x/innerWidth*2-1,-(y/innerHeight)*2+1);rc.setFromCamera(mouse,camera);
  const h=rc.intersectObjects(bm.children,false);
  if(tool==='erase')return h.length?{hit:h[0].object}:null;
  if(h.length){const o=h[0].object,n=h[0].face.normal,c=o.userData.cell;return{c:[c[0]+Math.round(n.x),c[1]+Math.round(n.y),c[2]+Math.round(n.z)]}}
  const p=new THREE.Vector3();if(rc.ray.intersectPlane(gp,p))return{c:[Math.round(p.x),0,Math.round(p.z)]};return null}
let drag=null;const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{drag={sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY,mv:false}});
addEventListener('pointermove',e=>{
  if(mode!=='build')return;
  if(drag){const t=Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy);if(t>5)drag.mv=true;
    if(drag.mv){theta-=(e.clientX-drag.x)*.006;phi=clamp(phi-(e.clientY-drag.y)*.006,.15,1.5)}drag.x=e.clientX;drag.y=e.clientY;ghost.visible=false;return}
  if(e.target!==cv){ghost.visible=false;return}
  const r=cellAt(e.clientX,e.clientY);
  if(!r||!r.c){ghost.visible=false;return}
  ghost.visible=true;ghost.position.set(r.c[0],r.c[1]+.5,r.c[2]);ghost.material.color.setHex(valid(r.c)?0x66ff88:0xff5555)});
addEventListener('pointerup',e=>{
  const d=drag;drag=null;if(!d||d.mv||mode!=='build'||e.target!==cv)return;
  const r=cellAt(e.clientX,e.clientY);if(!r)return;
  if(tool==='erase'){if(r.hit){const c=r.hit.userData.cell;S.blocks=S.blocks.filter(b=>!(b[0]==c[0]&&b[1]==c[1]&&b[2]==c[2]));bm.remove(r.hit);save();ui()}return}
  if(!S.owned[tool]){openShop();return}
  if(!valid(r.c)){toast('Can\'t build there (grid is 9 wide × 15 long × 6 tall)');return}
  if(S.blocks.length>=MAXB){toast('Max '+MAXB+' blocks!');return}
  const b=[r.c[0],r.c[1],r.c[2],tool];S.blocks.push(b);bm.add(mk(b));save();ui()});

// ---- shop ----
function openShop(){
  $('shopMoney').textContent='You have $'+S.money+'. Materials and parts you buy are yours forever.';
  const L=$('shopList');L.innerHTML='';
  [...Object.keys(MATS),'engine'].forEach(k=>{const m=INFO(k);const r=document.createElement('div');r.className='row';
    const d=k==='engine'?'+2.8 speed, 12 HP':`${m.hp} HP / block · weight ${m.w}`;
    r.innerHTML=`<b>${m.n}<small>${d}</small></b>`;
    const bt=document.createElement('button');bt.className='btn';
    if(S.owned[k]){bt.textContent='Owned ✓';bt.disabled=true}
    else{bt.textContent='Buy $'+m.price;bt.onclick=()=>{if(S.money<m.price){toast('Not enough money!');return}S.money-=m.price;S.owned[k]=1;save();ui();openShop();toast(m.n+' unlocked!')}}
    r.appendChild(bt);L.appendChild(r)});
  $('shop').classList.add('show')}
$('shopBtn').onclick=openShop;$('shopClose').onclick=()=>$('shop').classList.remove('show');

// ---- save/load code ----
let cm='save';
function openCode(m){cm=m;$('cTitle').textContent=m==='save'?'Save Code':'Load Code';

  comp=new THREE.EffectComposer(renderer,rt);comp.setPixelRatio(pr);comp.setSize(innerWidth,innerHeight);comp.addPass(new THREE.RenderPass(scene,camera));comp.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.6,.65,.9))}}catch(e){comp=null}
const qLbl=()=>$('qBtn').textContent=comp?'✨ Quality: '+(Q?'High':'Low'):'✨ Quality: Low';qLbl();
$('qBtn').onclick=()=>{if(!comp){toast('Glow effects unavailable here');return}Q=Q?0:1;try{localStorage.setItem('bc3d_q',Q)}catch(e){}qLbl()};
// ---- loop ----
let last=0;
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000||0);last=t;wt=t/1000;OU.uTime.value=wt;
  if(mode==='build'){bcam();ocean.position.set(0,.35,0);sun.position.set(15,25,10);sun.target.position.set(0,0,0)}
  else if(mode==='sail'){sailStep(dt);ocean.position.set(G.x,.35,G.z);sun.position.set(G.x+15,25,G.z+10);sun.target.position.set(G.x,0,G.z)}
  stepP(dt);stepW(dt,mode==='sail'?G.x:0,mode==='sail'?G.z:0);dome.position.copy(camera.position);mtA.position.set(camera.position.x,.35,camera.position.z);mtB.position.copy(mtA.position);stepG(wt,mode==='sail'?G.x:0,mode==='sail'?G.z:0);
  if(comp&&Q)comp.render();else renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);if(comp)comp.setSize(innerWidth,innerHeight)});
theme(0);rebuild();ui();requestAnimationFrame(loop);
</script></body></html>
