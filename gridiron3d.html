 flight={sx:q.x,sy:2.5,sz:q.z,tx:lx,ey:2.1,tz:lz,T,u:0,ap:Math.min(9,dist*.13),target:r,end:resolveCatch};carrier=null;ball.st='air';sfx('kick');menuBar()}
function resolveCatch(){const f=flight,r=f.target;flight=null;const x=f.tx,z=f.tz;
 if(Math.abs(z)>HW||Math.abs(x)>EZ){incomplete('INCOMPLETE — out of bounds');return}
 let best=null,bs=1e9;for(const e of all){if(e.down>0)continue;const d=hyp(e.x-x,e.z-z);if(d>2.6)continue;const s=d+rnd(0,1.3)-(e===r?.5:0)+(e.t==offT?0:.1);if(s<bs){bs=s;best=e}}
 if(!best)incomplete('INCOMPLETE');else if(best.t==offT){carrier=best;ball.st='held';mode='free';show('CAUGHT',700);sfx('hit')}
 else{offT=1-offT;flipped=true;carrier=best;ball.st='held';mode='free';show('INTERCEPTED!',1600);sfx('whistle');ph='live';menuBar()}}
function incomplete(m){ball.st='dead';G.down++;afterPlay(G.los,m,true)}
function afterPlay(x,msg,keep){ph='after';afterT=2.2;carrier&&(0);ball.st='dead';const d=dirOf(offT);let m=msg;
 if(!keep){if(x*d<=-FL){G.score[1-offT]+=2;m='SAFETY! +2';const t=1-offT;kickoffTo(t)}
  else if(x*d>=FL){G.score[offT]+=7;m='TOUCHDOWN! +7';sfx('roar');kickoffTo(1-offT)}
  else if(flipped){G.down=1;G.los=x;G.fdx=cl(x+d*10,-FL,FL);if(!msg)m='TURNOVER'}
  else if(x*d>=G.fdx*d){G.down=1;G.los=x;G.fdx=cl(x+d*10,-FL,FL);m=(msg?msg+' — ':'')+'FIRST DOWN'}
  else{G.down++;G.los=x}}
 if(!keep&&G.down>4&&!flipped){const nd=-d;offT=1-offT;G.down=1;G.fdx=cl(G.los+nd*10,-FL,FL);m='TURNOVER ON DOWNS'}
 else if(keep&&G.down>4){const nd=-d;offT=1-offT;G.down=1;G.fdx=cl(G.los+nd*10,-FL,FL);m+=' — TURNOVER ON DOWNS'}
 show(m,2000);hud();menuBar()}
function tackle(c,e){const x=cl(c.x,-EZ,EZ);c.down=e.down=2.6;ball.st='dead';sfx('hit');let m=c.role=='QB'&&(c.x-G.los)*dirOf(offT)<0?'SACK!':'';
 if(c.role!='QB'&&Math.random()<.035){flipped=Math.random()<.55;m='FUMBLE!'+(flipped?' Recovered by defense':' Offense recovers');if(flipped)offT=1-offT}
 carrier=null;afterPlay(x,m)}
function punt(){const t=offT,d=dirOf(t),dist=rnd(38,49),dest=G.los+d*dist,tb=dest*d>=FL;ph='kick';menuBar();show('PUNT',900);
 flight={sx:G.los-d*7,sy:1,sz:0,tx:tb?d*FL+d*4:dest,ey:.5,tz:rnd(-5,5),T:dist/26+.8,u:0,ap:16,end(){flight=null;ball.st='dead';offT=1-t;const d2=-d;G.down=1;G.los=tb?-d2*30:dest;G.fdx=cl(G.los+d2*10,-FL,FL);show(tb?'TOUCHBACK':'PUNT DOWNED',1500);ph='after';afterT=2;hud()}};ball.st='air';sfx('kick')}
function fieldGoal(){const t=offT,d=dirOf(t),dist=(FL-G.los*d)+17,p=cl(1.18-dist/56,.08,.97),ok=Math.random()<p;ph='kick';menuBar();show('FIELD GOAL TRY — '+Math.round(dist)+' yds',900);
 const wide=Math.random()<.5?1:-1;flight={sx:G.los-d*7,sy:1,sz:0,tx:d*EZ,ey:ok?6:(Math.random()<.5?6:2),tz:ok?rnd(-1.8,1.8):wide*rnd(4.2,7),T:(dist+7)/30+.6,u:0,ap:dist*.22,end(){flight=null;ball.st='dead';
  if(ok){G.score[t]+=3;show('FIELD GOAL IS GOOD! +3',2200);sfx('roar');kickoffTo(1-t)}else{show('NO GOOD',1800);const ls=G.los;offT=1-t;G.down=1;G.los=ls;G.fdx=cl(ls+dirOf(offT)*10,-FL,FL)}ph='after';afterT=2.4;hud()}};ball.st='air';sfx('kick')}
function cpu4(){const d=dirOf(offT),gd=FL-G.los*d,y=ytg();if(gd+17<=52&&y>2)return 'fg';if(G.los*d<5&&y>1)return 'punt';return y<=3?'go':'punt'}
function ctrlSelect(){const c=carrier;if(c&&c.t==0)ctrl=c;else if(flight&&flight.target&&flight.target.t==0)ctrl=flight.target;else if(offT==0&&mode=='script'&&ball.st!='dead'&&!flight)ctrl=qbE;
 else{const tx=c?c.x:ball.x,tz=c?c.z:ball.z;let b=1e9;for(const e of Tm[0]){if(e.down>0)continue;const d=hyp(e.x-tx,e.z-tz);if(d<b){b=d;ctrl=e}}}}
function inputVec(){const cd2=dirOf(offT),f=(keys.w||keys.ArrowUp?1:0)-(keys.s||keys.ArrowDown?1:0),r=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),m=hyp(f,r);if(!m)return null;return[cd2*f/m,cd2*r/m]}
function think(e,dt){const d=dirOf(offT),A=e.t==offT,s=SP[e.role],c=carrier;
 if(c&&e===c){let tz=e.z;const[dd,dist]=nearest(Tm[1-e.t],e.x,e.z,q=>(q.x-e.x)*dirOf(e.t)>-1.5);if(dd&&dist<10)tz=e.z+(e.z>dd.z?1:-1)*6;else tz=e.z*.92;if(play.out&&pt<1.3&&!flipped)tz=(Math.sign(e.z)||1)*15;return go(e,e.x+dirOf(e.t)*10,cl(tz,-HW+2,HW-2),s)}
 if(mode=='free'||(c&&c.t!=offT)){
  if(c&&e.t!=c.t)return go(e,c.x+c.vx*.35,c.z+c.vz*.35,s*(e.eng>0?.4:1));
  if(c){const[dd,dist]=nearest(Tm[1-e.t],e.x,e.z);if(dd&&dist<14&&(e.role=='OL'||e.role=='TE'||e.role=='WR'||c.t!=offT)){if(dist<1.9)dd.eng=.15;return go(e,dd.x,dd.z,s)}return go(e,c.x+dirOf(c.t)*5,e.z*.8+c.z*.2,s)}
  if(ball.st=='snap')return go(e,e.x+dirOf(e.t)*3,e.z,s*.8);return[0,0]}
 if(A){
  if(e.role=='OL'){const[dd,dist]=nearest(Tm[1-e.t],e.x,e.z,q=>q.role=='DL'||q.role=='LB');if(dd&&dist<2)dd.eng=.15;return go(e,e.x-d*(pt<.4?.8:0),e.z,s)}
  if(e===qbE){if(e.down>0)return[0,0];const q=e;if(pt<1)return go(q,G.los-d*7,0,s);const[dd,dist]=nearest(Tm[1-offT],q.x,q.z);if(dd&&dist<4&&dd.role=='DL')return go(q,q.x-d*.5,q.z+(q.z>dd.z?1:-1)*3,s*.8);return[0,0]}
  if(flight&&flight.target===e){const T=flight;return go(e,T.tx,T.tz,s)}
  if(e.route.length){if(e.rp<e.route.length){const w=e.route[e.rp];if(hyp(w.x-e.x,w.z-e.z)<1.2)e.rp++;return go(e,w.x,w.z,s)}return go(e,e.x+d*2,e.z,s*.4)}
  if(e.role=='RB'||e.role=='TE'||e.role=='WR'){return[0,0]}return[0,0]}
 // defense script
 const i=e.i,rt=COV[i]!==undefined?off(COV[i]):null;
 if(flight){const[dd]=[hyp(flight.tx-e.x,flight.tz-e.z)];if(dd<11)return go(e,flight.tx,flight.tz,s)}
 if(e.role=='DL')return go(e,qbE.x,qbE.z,s*(e.eng>0?.28+.5*e.beat:1));
 if(e.role=='LB'&&!rt)return go(e,G.los+d*7,0,s*.8);
 if(rt)return go(e,rt.x+d*1.1,rt.z,s*.97);
 return go(e,G.los+d*16,0,s*.7)}
function update(dt){
 if(ph=='pre'){preT-=dt;if(offT==1&&preT<=0){const a=G.down==4?cpu4():'go';if(a=='punt')punt();else if(a=='fg')fieldGoal();else snap()}else if(offT==0&&false){}}
 else if(ph=='live'||ph=='kick'){
  if(ph=='live'){pt+=dt;G.qt=Math.max(0,G.qt-dt);
   if(ball.st=='snap'){const u=Math.min(1,pt/.35),to=play.run?off(1):qbE;ball.x=G.los+(to.x-G.los)*u;ball.z=to.z*u;ball.y=.6+Math.sin(u*3.1)*.7;if(u>=1){ball.st='held';carrier=to;menuBar()}}
   ctrlSelect();
   for(const e of all){let v=[0,0];if(e.down>0||e.stun>0){e.down-=dt;e.stun-=dt}else{if(e===ctrl){const iv=inputVec();if(iv){const sp=SP[e.role]*(keys.Shift&&e===carrier?1.12:1)*(e.dive>0?1.7:1);v=[iv[0]*sp,iv[1]*sp]}else if(e.dive>0)v=[Math.cos(e.f)*10,Math.sin(e.f)*10]}else v=think(e,dt);if(e.eng>0&&e.t!=offT||e.eng>0)v=[v[0]*.45,v[1]*.45]}
    const a=Math.min(1,9*dt);e.vx+=(v[0]-e.vx)*a;e.vz+=(v[1]-e.vz)*a;e.x=cl(e.x+e.vx*dt,-EZ-5,EZ+5);e.z=cl(e.z+e.vz*dt,-HW-6,HW+6);const sp=hyp(e.vx,e.vz);if(sp>.7){let da=Math.atan2(e.vz,e.vx)-e.f;da=Math.atan2(Math.sin(da),Math.cos(da));e.f+=da*Math.min(1,12*dt)}e.ph+=sp*dt*1.3;e.eng-=dt;e.dive-=dt;e.juke-=dt;e.tcd-=dt;e.jcd-=dt;if(e.dive<=0&&e.dive>-.02)e.stun=.6}
   for(let i=0;i<22;i++)for(let j=i+1;j<22;j++){const a=all[i],b=all[j];if(a.down>0||b.down>0)continue;const dx=b.x-a.x,dz=b.z-a.z,d=hyp(dx,dz);if(d<1.1&&d>.01){const p=(1.1-d)/2/d;a.x-=dx*p;a.z-=dz*p;b.x+=dx*p;b.z+=dz*p}}
   // CPU qb throw
   if(offT==1&&mode=='script'&&carrier===qbE&&pt>1.3&&!flight){const[dd,dist]=nearest(Tm[0],qbE.x,qbE.z,q=>q.role=='DL');qbE.thr-=dt;if(qbE.thr<=0||dist<2.8){let best=null,bs=-1e9;for(const k of[1,2,3,4,5]){const r=off(k),sep=nearest(Tm[0],r.x,r.z)[1],s=sep+(r.x-G.los)*dirOf(offT)*.12;if(s>bs){bs=s;best=r}}throwTo(qbE,best)}}
   if(mode=='script'&&carrier&&(carrier.x-G.los)*dirOf(carrier.t)>1.5)mode='free';
   const c=carrier;if(c){ball.x=c.x+Math.cos(c.f)*.6;ball.z=c.z+Math.sin(c.f)*.6;ball.y=1.7;
    for(const e of Tm[1-c.t]){if(e.down>0||e.stun>0||e.tcd>0)continue;const reach=e.dive>0?2.2:1.15;if(hyp(e.x-c.x,e.z-c.z)<reach){e.tcd=.5;if(c.juke>0){e.stun=.6;continue}
      if(e.dive<=0&&c.role!='QB'&&Math.random()<.2){e.down=.9;sfx('hit');continue}tackle(c,e);break}}
    if(ph=='live'&&c&&c.down<=0){if(Math.abs(c.z)>HW){c.down=1;afterPlay(cl(c.x,-EZ,EZ),'OUT OF BOUNDS');carrier=null}else if(c.x*dirOf(c.t)>=FL||c.x*dirOf(c.t)<=-FL-.5){const x=c.x;carrier=null;ball.st='dead';afterPlay(x*dirOf(c.t)>0?FL*dirOf(c.t):-FL*dirOf(c.t),'')}}}}
  if(flight){flight.u=Math.min(1,flight.u+dt/flight.T);const f=flight,u=f.u;ball.x=f.sx+(f.tx-f.sx)*u;ball.y=f.sy+(f.ey-f.sy)*u+f.ap*4*u*(1-u);ball.z=f.sz+(f.tz-f.sz)*u;if(u>=1)f.end()}}
 else if(ph=='after'){afterT-=dt;if(afterT<=0){if(G.qt<=0){if(G.q>=4){endGame();return}G.q++;G.qt=QL;if(G.q==3){kickoffTo(1);show('SECOND HALF',1500)}}setup()}}}
function endGame(){ph='over';$('sb').style.display='none';$('pl').style.display='none';const a=G.score[0],b=G.score[1];ui(`<h1>FINAL</h1><p style="font-size:34px;font-weight:900">COBALT ${a} — ${b} CRIMSON</p><p>${a>b?'🏆 YOU WIN!':b>a?'CRIMSON WINS':'TIE GAME'}</p><button onclick="start()">Play again</button>`)}
function ui(h){$('ui').innerHTML='<div class="panel">'+h+'</div>';$('ui').style.display='flex'}
function menu(){ui(`<h1>GRIDIRON 3D</h1><p>11-on-11 American football · 4 quarters · downs, first-down line, punts, field goals, turnovers</p><p><small><b>Offense:</b> 1-4 pick a play, SPACE snap · pass: keys 1-5 throw to the numbered receiver · WASD / SHIFT / SPACE juke<br><b>Defense:</b> WASD + SPACE dive tackle · 4th down: P punt, F field goal<br>You are COBALT, driving toward the right end zone.</small></p><button onclick="start()">🏈 Kick off</button>`)}
function start(){initAudio();G.q=1;G.qt=QL;G.score=[0,0];sel=2;kickoffTo(0);$('ui').style.display='none';$('sb').style.display='flex';setup();show('KICKOFF',1200)}
addEventListener('keydown',e=>{const k=e.key.length==1?e.key.toLowerCase():e.key;if(e.repeat){e.preventDefault();return}keys[k]=1;if(k.startsWith('Arrow')||k==' ')e.preventDefault();
 if(ph=='pre'&&offT==0){if(k>='1'&&k<='4'){sel=+k-1;play=PLAYS[sel];menuBar()}if(k==' '||k=='Enter')snap();if(G.down==4&&k=='p')punt();if(G.down==4&&k=='f')fieldGoal()}
 else if(ph=='pre'&&offT==1&&(k==' '))snap();
 else if(ph=='live'){if(offT==0&&mode=='script'&&carrier===qbE&&k>='1'&&k<='5')throwTo(qbE,off([0,3,4,5,2,1][+k]));
  if(k==' '){const e2=ctrl;if(e2===carrier&&e2.jcd<=0){e2.juke=.5;e2.jcd=1.6}else if(e2.t!=offT&&e2.dive<=0&&e2.stun<=0&&e2.jcd<=0){e2.dive=.4;e2.jcd=1.5}}}});
addEventListener('keyup',e=>{keys[e.key.length==1?e.key.toLowerCase():e.key]=0});addEventListener('blur',()=>{for(const k in keys)keys[k]=0});
function resize(){rd.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();
// ---- loop
const lab=document.querySelectorAll('.rl'),V=new THREE.Vector3();let last=0;
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000||0);last=t;
 if(ph!='menu'&&ph!='over')update(dt);
 for(const e of all){const a=Math.min(1,hyp(e.vx,e.vz)/8)*.95,s=Math.sin(e.ph),dn=e.down>0||e.stun>0&&0;
  e.m.g.position.set(e.x,dn?.35:Math.abs(s)*.12*a,e.z);e.m.g.rotation.y=Math.PI/2-e.f;e.m.g.rotation.x+=((dn?-1.45:e.dive>0?-.9:0)-e.m.g.rotation.x)*Math.min(1,14*dt);
  e.m.legs[0].rotation.x=s*a;e.m.legs[1].rotation.x=-s*a;e.m.arms[0].rotation.x=-s*a;e.m.arms[1].rotation.x=s*a;if(e===carrier)e.m.arms[1].rotation.x=-1.1;if(e===qbE&&flight&&flight.u<.3)e.m.arms[1].rotation.x=-2.5}
 ballM.position.set(ball.x,ball.y,ball.z);if(ball.st=='air'){ballM.rotation.y=Math.atan2(flight?flight.tz-flight.sz:0,flight?flight.tx-flight.sx:1)*-1;ballM.rotation.z+=dt*8}else{ballM.rotation.z=0;ballM.rotation.y=ctrl?-ctrl.f:0}
 ring.visible=(ph=='live'||ph=='pre')&&ph!='menu';ring.position.set(ctrl.x,.08,ctrl.z);
 const show5=ph=='live'&&offT==0&&mode=='script'&&carrier===qbE&&ball.st=='held';
 lab.forEach((l,i)=>{const r=off([0,3,4,5,2,1][i+1]);if(show5&&r){V.set(r.x,3.8,r.z).project(cam);l.style.display=V.z<1?'block':'none';l.style.left=(V.x*.5+.5)*innerWidth+'px';l.style.top=(-V.y*.5+.5)*innerHeight+'px';l.textContent=i+1}else l.style.display='none'});
 const d=dirOf(offT),k=1-Math.exp(-dt*3.5);
 if(ph=='menu'||ph=='over'){const a=t/7000;cam.position.set(Math.sin(a)*95,38,Math.cos(a)*95);cam.lookAt(0,0,0)}
 else{const fxT=ph=='live'||ph=='kick'||ph=='after'?(carrier?carrier.x:ball.x):G.los,fz=carrier?carrier.z*.5:0;fx+=(fxT-fx)*k;
  cam.position.x+=((fx-d*26)-cam.position.x)*Math.min(1,dt*5);cam.position.y+=(15-cam.position.y)*k;cam.position.z+=(fz*.6-cam.position.z)*k;cam.lookAt(cam.position.x+d*24,0,cam.position.z*.5)}
 dl.position.set(cam.position.x+d*22+10,60,16);dl.target.position.set(cam.position.x+d*22,0,0);
 if(crowdG&&ph=='live')crowdG.gain.value=Math.max(crowdG.gain.value,.05+.03*(Math.abs(ball.x)>35?1:0));
 rd.render(scene,cam)}
setup();ph='menu';ctrl=Tm[0][0];menu();cam.position.set(0,40,95);requestAnimationFrame(loop);
</script></body></html>
