<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkey Mart Unblocked - Full Screen</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevent scrollbars */
            background-color: #000; /* Black background for immersion */
        }
        
        .game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Fullscreen Button Styling */
        #fs-btn {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 10000;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            font-family: sans-serif;
            font-size: 12px;
            opacity: 0.7;
            transition: opacity 0.3s;
        }
        #fs-btn:hover {
            opacity: 1;
        }
    </style>
</head>
<body>

<div class="game-container">
    <iframe 
        id="gameFrame"
        src="https://classroom-6x.org/games/monkey-mart-unblocked/" 
        frameborder="0" 
        sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-pointer-lock"
        title="Monkey Mart Unblocked">
    </iframe>
</div>

<button id="fs-btn" onclick="toggleFullScreen()">Full Screen</button>

<script>
    function toggleFullScreen() {
        var elem = document.documentElement; // Make the whole page fullscreen
        
        if (!document.fullscreenElement) {
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) { /* Safari */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { /* IE11 */
                elem.msRequestFullscreen();
            }
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) { /* Safari */
                document.webkitExitFullscreen();
            } else if (document.msExitFullscreen) { /* IE11 */
                document.msExitFullscreen();
            }
        }
    }
</script>

</body>
</html>
